<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f4ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Recetas Air" />
    <meta name="description" content="Tu recetario personal para air fryer, siempre sin aceite." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <title>Recetas Air</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) window.addEventListener('load', async () => {
        const registration = await navigator.serviceWorker.register('./sw.js')
        registration.update()
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!sessionStorage.getItem('recetas-air:reloaded')) {
            sessionStorage.setItem('recetas-air:reloaded', '1')
            window.location.reload()
          }
        })
      })
    </script>
  </body>
</html>
